[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoeval-lab"
version = "0.1.0"
description = "Reproducible code challenge verification with external tests and structured reports"
requires-python = ">=3.10"
dependencies = ["pytest>=8,<10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
repoeval = "repoeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repoeval = ["task_template/*.md", "task_template/*.json", "task_template/starter/*.py", "task_template/solution/*.py", "task_template/checks/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
